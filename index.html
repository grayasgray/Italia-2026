<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <!-- Bodoni Moda display + Manrope body -->
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <!-- Default to dark theme, matches device preference -->
  <script>
    (function() {
      // Default to light (Alpino alpine palette)
      // User can switch to dark in Settings if preferred
      const saved = localStorage.getItem('ts_theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
      // If no saved preference, light mode is the default — no attribute needed
    })();
  </script>
  <meta name="theme-color" content="#E8EAE4" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#10130F" media="(prefers-color-scheme: dark)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Italia 2026"/>
  <meta name="description" content="Your personal Italy 2026 travel companion"/>
  <title>Italia 2026</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="./icons/icon-512.png"/>
  <link rel="stylesheet" href="./css/app.css"/>
</head>
<body>
  <!-- Grain texture overlay — Alpino aesthetic -->
  <div class="grain" aria-hidden="true"></div>
  <div id="app">
    <div class="loading-screen">
      <img src="./icons/icon-192.png" class="loading-eagle" alt=""/>
      <p class="loading-text">Italia 2026</p>
    </div>
  </div>
  <script src="./js/store.js"></script>
  <script src="./js/ics-parser.js"></script>
  <script src="./js/claude.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
